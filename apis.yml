apis:
- aid: tzafon:lightcone-api
  name: Lightcone API
  description: >-
    The Lightcone API by Tzafon provides cloud browser and desktop computers
    operated by AI. It spans an agent Tasks API (start, stream, pause, resume,
    inject messages) driven by the Northstar computer-use model, a direct
    computer-control surface (create/list/delete computers, click, type,
    scroll, navigate, screenshot, shell exec, tabs, batch actions), an
    OpenAI-compatible Responses API with computer-use tool calls and
    multi-turn previous_response_id chaining, Chat Completions, and a Models
    listing. Errors use RFC 7807 problem+json; task streams are resumable SSE.
  image: https://docs.lightcone.ai/og-image.jpg
  humanURL: https://docs.lightcone.ai/
