aid: tzafon
name: Tzafon
description: >-
  Tzafon is a machine intelligence company with offices in San Francisco, Tel
  Aviv, and Zurich, advancing multimodality, high performance compute, and
  continuous learning. Its developer platform Lightcone is the computer-use
  API: cloud browsers and desktops operated by Northstar, a vision-language
  model trained with GUI reinforcement learning to see screens and act on
  them. Developers describe work in plain language and Northstar operates a
  computer from start to finish, or they drive computers directly through a
  REST API, official Python and TypeScript SDKs, a CLI, and an official MCP
  server -- with OpenAI-compatible Responses and Chat Completions endpoints
  for drop-in computer-use loops.
